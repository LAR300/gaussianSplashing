name: gaussian_splattingUW
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  ##- cudatoolkit=12.0 # may not exists on anaconda channels
  - plyfile=0.8.1
  - python=3.8
  - pip=22.3.1
  - pytorch=2.0.0
  - torchaudio=2.0.0
  - torchvision=0.15.0
  - tqdm
  - pip:
    - torch==2.1.2+cu121  # Adjust version and CUDA version as needed
    - torchvision==0.16.2+cu121  # Adjust version and CUDA version as needed
    - torchaudio==2.1.2+cu121  # Adjust version and CUDA version as needed  
    - matplotlib
    - wandb
pre_build:
  - pip install --upgrade pip
  - pip install submodules/diff-gaussian-rasterization
  - pip install submodules/simple-knn
